<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Very Bab Thanksgiving</title><style>
:root{color-scheme:light;--ink:#242424;--muted:#696969;--line:#dededb;--green:#63834b}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main,header .inner,nav .inner{max-width:900px;margin:auto;padding:20px}header{background:#faf8f4;border-bottom:1px solid var(--line)}h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:10px 0}h2{font-size:26px;line-height:1.25;margin:36px 0 14px}h3{font-size:20px;margin:22px 0 10px}p{margin:8px 0 16px}small,.muted{color:var(--muted)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}nav .inner{display:flex;gap:8px;overflow:auto;padding:10px 20px}a,button{color:inherit}nav a,button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 13px;text-decoration:none;white-space:nowrap;font:inherit;cursor:pointer}section{scroll-margin-top:75px}.card{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.card h3{margin-top:0}label.task{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #eee;cursor:pointer}label.task:last-child{border:0}input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--green);margin:2px 0}label:has(input:checked) .tasktext{text-decoration:line-through;color:#888}body.hide label.task:has(input:checked){display:none}.tasktext{flex:1}.time{font-weight:650;color:#555;font-variant-numeric:tabular-nums}.tag{font-size:12px;color:#666;float:right;margin-left:8px}.progress{height:7px;background:#eee;border-radius:10px;overflow:hidden;margin:8px 0}.progress i{display:block;background:var(--green);height:100%;transition:width .2s}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.note{border-left:3px solid #a66c44;padding:8px 12px;background:#faf8f4}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:#666} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.temp{width:90px;padding:8px;font:inherit;border:1px solid #ccc;border-radius:8px}.hero{font-size:28px;font-weight:700;text-align:center}.recipehead{border-bottom:1px solid var(--line);padding-bottom:8px}.bar{height:30px;border-radius:5px;color:white;font-size:11px;display:flex;align-items:center;justify-content:center;position:absolute;overflow:hidden;white-space:nowrap}.lane{height:42px;position:relative;background:repeating-linear-gradient(to right,#eee 0,#eee 1px,transparent 1px,transparent 20%)}.chartrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:12px}.chartrow>div{min-width:0} @media(max-width:520px){main,header .inner{padding:15px}.grid{grid-template-columns:1fr}.card{padding:12px}h2{font-size:23px}}@media print{nav,.controls{display:none}body{font-size:11pt}.card{break-inside:avoid}section{scroll-margin:0}}
</style></head><body><header><div class="inner"><h1>🐾 A Very Bab Thanksgiving</h1><b>Thursday, November 26, 2026 • Dinner at 4:00 PM Arizona time</b><p>The complete Thanksgiving run of show. <b>MODIFIED</b> identifies changes to HelloFresh instructions.</p><div id="overall"></div><div class="controls"><label><input id="hide" type="checkbox"> Hide completed tasks</label> <button onclick="window.print()">Print plan</button></div></div></header><nav><div class="inner" id="nav"></div></nav><main id="main"></main><script>const data={
'Ingredients':{
'HelloFresh — turkey & gravy':['14 lb pre-brined turkey','8 tbsp garlic herb butter — reserve some for carrots; use turkey packet as labeled','2 shallots (1 for turkey, ½ for gravy)','7 garlic cloves total (4 turkey, 1 gravy, 2 potatoes)','Thyme, ½ oz total','Sage, ½ oz total','Chicken demi-glace — supplied packet','Chicken stock concentrates — 5 total; divide by recipe packets','Flour — 3 tbsp for gravy','Chicken stock — enough to bring drippings to 3 cups','Butter — 2 tbsp for gravy plus 1 tbsp reserved turkey fat'],
'Stuffing':['8 brioche buns','5 oz celery','1 onion','2 oz dried cranberries','1 veggie stock concentrate','Chicken stock concentrates allocated to stuffing','2 tsp garlic powder','2 tbsp chopped sage','1 tbsp chopped thyme','2 eggs','5 tbsp butter','2 cups warm water'],
'Potatoes & carrots':['24 small potatoes','6 tbsp sour cream','2 supplied milk units','2 garlic cloves','8 tbsp plain butter for potatoes (6 original + 2 extra)','36 oz carrots','2 thumbs ginger','¼ oz parsley','Pecans — carrot packet, separate from crisp portion','3 tbsp brown sugar','Garlic herb butter — carrot packet','Oil'],
'Cranberry sauce & dessert':['24 oz fresh cranberries','1 orange','1¼ cups sugar for sauce, extra to taste','¼ tsp cinnamon for sauce','8 Granny Smith apples','1 lemon (2 tbsp juice, 2 tsp zest)','Pecans — apple crisp packet; 3½ oz total across recipes','1¼ cups + 2 tbsp flour for crisp','⅓ cup sugar for filling','½ cup sugar for topping (optional half brown sugar)','1½ tsp cinnamon for crisp, divided','9 tbsp butter','Vanilla extract, optional 1 tsp','Nutmeg, optional ⅛ tsp','Vanilla ice cream — on hand'],
'Mac & cheese / rolls':['Cavatappi — supplied package','Cream sauce base','Cream cheese','Cheddar — all supplied','Chicken stock concentrate and garlic powder from mac kit','Panko and Everything Bagel seasoning (optional topping)','Milk — on hand; ¾ cup for 2 servings or 1½ cups for 4 to start','Butter — 1 tbsp for sauce (2 for 4), plus optional panko butter','Dry mustard optional','Rhodes bake-and-serve rolls','Melted butter for rolls'],
'Pantry & equipment':['Kosher salt and black pepper','Cooking spray','Cooking oil','At least 1 lb plain butter total on hand','Sugar — at least 3 cups on hand','Extra cinnamon (total 1¾ tsp including cranberry sauce)','Roasting pan and thermometer','Two 9×13 baking dishes','Sheet pans that fit June oven','Foil, parchment, paper towels','Large potato pot, pasta pot, sauce pan, gravy pan','Colander, masher, whisk, carving board, fat separator or measuring cup','Serving bowls, platter, gravy boat, trivets']},
'Wednesday':{'Advance prep':['Check turkey is thawing in refrigerator at 40°F or below; keep in original bag on tray. If still icy Thursday, use sealed cold-water thaw, changing water every 30 minutes; cook immediately afterward.','Toast 1-inch brioche cubes at 275°F for 25–35 min, tossing halfway. Cool and store airtight. MODIFIED.','Make cranberry sauce using recipe tab; refrigerate.','Bake apple crisp using recipe tab; cool and refrigerate within 2 hours.','Dice onion and celery; peel and cut carrots; refrigerate separately.','Chop herbs and separate by recipe; reserve turkey sprigs.','Candy carrot pecans; cool and store airtight.','Set out serving dishes, thermometer, pans and utensils; verify rolls package temperature/time.']},
'Thursday':{'Morning':['9:30 AM — Check turkey thawed; if icy, finish cold-water thaw safely before roasting.','10:30 AM — Preheat main oven to 425°F; soften herb butter.','10:45 AM — Unwrap turkey, remove neck/giblets, pat dry, add aromatics and butter. No extra brine; no need to leave out for an hour.','11:15 AM — Turkey into main oven at 425°F.','11:45 AM — Reduce main oven to 350°F. MODIFIED.'],
'Afternoon':['1:00 PM — Prepare stuffing aromatics and stock mixture; keep separate from bread/eggs until closer to baking.','1:30 PM — Prepare potatoes and garlic; cover with cold water. Prep carrots and gravy aromatics.','2:00 PM — Check turkey temperature; continue roasting until 165°F in breast, inner thigh and wing. Expected finish 2:15–2:45 PM, but allow longer if needed.','2:30 PM — Assemble stuffing with eggs and stock; refrigerate if waiting for oven.','2:45 PM — Start Kelly’s potatoes on stovetop; simmer 15–20 min once boiling.','3:00 PM — Target turkey out by now; rest 15 min in pan then 15 min on board, loosely tent. Collect drippings. Main oven to 450°F.','3:05 PM — Stuffing into main oven, covered 20 min then uncovered 10–15 min; center 165°F. If turkey delayed, use June for stuffing if dish fits, then carrots in main oven.','3:10 PM — June oven preheat 425°F; toss carrots with ginger and oil.','3:20 PM — Carrots into June, 20–25 min. Start pasta water and gravy.','3:25 PM — Cook pasta 9–11 min; make cheese sauce. Finish mashed potatoes and keep covered hot.','3:35 PM — Finish gravy; keep hot. Check stuffing and remove when done.','3:40 PM — Bake rolls in main oven, adjusted to package temperature and timing; start earlier if package requires.','3:45 PM — Finish mac and cheese on stovetop; toss carrots with herb butter, add pecans and parsley just before serving.','3:50 PM — Carve turkey; finish potatoes with remaining butter and warm milk; butter rolls; plate sides and cranberry sauce.','4:00 PM — Dinner! Keep hot foods at 140°F or above if delayed. Refrigerate leftovers within 2 hours.','After dinner — Reheat apple crisp at 425°F about 15 min or until hot (165°F if refrigerated); serve with ice cream.']},
'Recipes':{
'Turkey — main oven':['MODIFIED: Already brined; do not dry-brine or add generous salt. Remove packaging, neck and giblets; leave oven-safe leg clamp. Do not rinse. Pat dry.','Put 1 halved shallot, 4 peeled garlic cloves and 2 thyme sprigs in cavity. Rub turkey allocation of softened garlic herb butter under breast skin and over exterior. Pepper to taste.','Place breast up in roasting pan; tuck wings. Roast 425°F 30 min then 350°F until done (roughly 3–3½ hours total, variable). Check breast, innermost thigh and wing all reach 165°F.','Rest 15 min in pan, then 15 min on board. Save drippings; carve just before serving.'],
'Brioche stuffing — main oven':['MODIFIED: Toast cubed buns Wednesday at 275°F for 25–35 min.','Dice celery and onion; chop 2 tbsp sage and 1 tbsp thyme. Soak dried cranberries and allocated stock concentrates in 2 cups warm water.','Melt 3 tbsp butter; sauté onion and celery 7–8 min. Add garlic powder, sage and thyme for 30 sec. Add cranberry liquid, bring to boil, turn off heat.','Mix bread with vegetable mixture gradually until moist, not soggy. Cool briefly, stir in 2 beaten eggs. Transfer to greased 9×13 dish; dot with 2 tbsp butter.','Cover with sprayed foil; bake 450°F 20 min, uncover 10–15 min until crisp and center 165°F. Rest 5–10 min.'],
'Kelly’s mashed potatoes — stovetop':['Peel if desired; dice potatoes into 1-inch pieces. Add 2 peeled garlic cloves and cover with salted water by 2 inches.','Bring to boil, simmer 15–20 min until tender. Drain. Mash with 3 tbsp butter, 6 tbsp sour cream and half supplied milk (warm milk first).','Season to taste. Cover and keep hot. MODIFIED: Finish with 5 tbsp butter instead of 3 and remaining warm milk as needed.'],
'Ginger carrots — June oven':['Peel and slice carrots diagonally ½ inch thick; grate ginger and chop parsley and allocated pecans.','Candy pecans: heat 2 tsp water, 3 tbsp brown sugar and pinch salt 2–3 min; add pecans and stir 2–4 min. Cool on parchment and break apart.','Toss carrots with oil, salt, pepper and ginger (start with half). Spread in single layer; roast 425°F 20–25 min until tender. Use two batches or main oven if crowded.','Toss with carrot allocation of garlic herb butter; top with parsley and candied pecans just before serving.'],
'Cranberry sauce — Wednesday':['Zest orange, peel and chop flesh. Combine with 24 oz cranberries, 1¼ cups sugar (MODIFIED), 4 tbsp water, ¼ tsp cinnamon and pinch salt.','Simmer medium-high 12–15 min, then cover on low 3–5 min until thick. Taste and add sugar if needed. Cool and refrigerate.'],
'Gravy — stovetop':['Mince ½ shallot and 1 garlic clove; chop ½ tsp each thyme and sage.','Separate drippings; reserve 1 tbsp turkey fat. Add chicken stock to skimmed drippings to make 3 cups. MODIFIED.','Melt 2 tbsp butter and reserved fat; sauté aromatics 1 min. Whisk in 3 tbsp flour for 2–3 min.','Slowly whisk in liquid, demi-glace and allocated chicken stock concentrates gradually to taste. Bring to boil then simmer 10–15 min. Season as needed.'],
'Mac and cheese — stovetop':['Skip broccoli, tomato and jalapeño. Optional: toast panko with Everything Bagel seasoning in 1 tbsp butter (2 for 4 servings) for 2–3 min; set aside.','Boil cavatappi 9–11 min until al dente; drain.','MODIFIED: Whisk cream sauce base with ¾ cup milk (1½ cups for 4 servings) instead of water. Simmer gently; add cream cheese, allocated stock concentrate and garlic powder; whisk 2–3 min.','Off heat stir in all supplied cheddar and 1 tbsp butter (2 for 4 servings). Optional ¼ tsp dry mustard for 4. Add more milk as needed. Combine with pasta; skip baking. Serve with optional panko.'],
'Rhodes rolls':['Follow package bake-and-serve directions from frozen or thawed as specified; verify temperature and duration before Thursday.','Brush with melted butter after baking.'],
'Apple crisp — Wednesday':['Preheat 375°F; grease 9×13 dish. Dice 9 tbsp butter and chill. Peel, core and dice 8 apples into ½-inch pieces.','Toss apples with 2 tbsp lemon juice, 2 tsp zest, ⅓ cup sugar, 2 tbsp flour, ¾ tsp cinnamon, optional 1 tsp vanilla and ⅛ tsp nutmeg. Spread in dish. MODIFIED.','Mix allocated pecans, 1¼ cups flour, ½ cup sugar, ¾ tsp cinnamon and pinch salt. Rub in cold butter and 1–2 tsp water until crumbly; add more water if needed.','Scatter topping without pressing. Bake 45 min until golden and tender; tent if browning too quickly. Cool and refrigerate. Reheat after dinner; serve with ice cream.']},
'Appliances':{'Main oven':['Wednesday: brioche 275°F; apple crisp 375°F.','Thursday 11:15 turkey 425°F; 11:45 reduce to 350°F.','After turkey: stuffing 450°F, then rolls at package temperature.','After dinner: apple crisp 425°F.'],'June oven':['3:10 preheat 425°F; 3:20 carrots 20–25 min. Check pan fits and carrots are not crowded.','Backup for stuffing or rolls if main oven delayed; adjust schedule to actual package directions.'],'Stovetop & Instant Pot':['Burner 1: Kelly’s potatoes. Burner 2: pasta. Burner 3: cheese sauce. Burner 4: gravy.','Instant Pot optional Keep Warm for already-hot gravy or potatoes; verify food stays at least 140°F. Do not pressure cook potatoes.']}};
const $=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem('bab-thanksgiving-full-v2')||'{}')}catch{};const save=()=>{try{localStorage.setItem('bab-thanksgiving-full-v2',JSON.stringify(state))}catch{}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let count=0;const main=$('main');function add(s){main.insertAdjacentHTML('beforeend',s)}function section(id,title){add(`<section id="${id}"><h2>${title}</h2><div id="body-${id}"></div></section>`);return $('body-'+id)}function table(rows,heads=['Ingredient','Amount']){return `<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}function checklist(title,items,opts={}){let id='c'+count++;return `<div class="card" data-group="${id}"><div class="between"><b>${esc(title)}</b><small class="count"></small></div><div class="progress"><i></i></div>${items.map((v,i)=>{let key=id+'-'+i;let [a,...rest]=v.split(' — ');return `<label class="task"><input type="checkbox" data-key="${key}" ${state[key]?'checked':''}><span class="tasktext">${opts.timed&&rest.length?`<span class="time">${esc(a)}</span><br>${esc(rest.join(' — '))}`:esc(v)}</span></label>`}).join('')}</div>`}function put(id,s){$(id).insertAdjacentHTML('beforeend',s)}
const menu=[['Garlic herb roasted turkey','Regular oven','Thursday'],['Classic turkey gravy','Stovetop','Thursday'],['Orange cranberry sauce','Stovetop','Wednesday'],["Kelly’s creamy mashed potatoes",'Stovetop','Thursday'],['Brioche cranberry stuffing','Regular oven','Thursday'],['Ginger-roasted carrots with candied pecans','June oven','Thursday'],['Creamy cheddar mac and cheese','Stovetop','Thursday'],['Rhodes dinner rolls','June or regular oven','Thursday'],['Apple crisp with vanilla ice cream','Regular oven','Wednesday'],['Optional hot holding','Instant Pot','Thursday']];
section('menu','1. Menu and appliance assignments').innerHTML=table(menu,['Dish','Appliance','When']);
section('ingredients','2. Master ingredient checklist').innerHTML='<p>Divide shared ingredients by recipe before cooking. Chicken stock, milk and ice cream are already on hand.</p>'+Object.entries(data.Ingredients).filter(([k])=>k!=='Pantry & equipment').map(([k,v])=>checklist(k,v)).join('')+checklist('Pantry supplies',['2 lb regular butter (recommended supply)','3 cups granulated sugar','½ cup brown sugar','2 cups all-purpose flour','At least 1¾ tsp cinnamon','1 quart chicken stock','½ gallon milk','Salt and black pepper','Cooking oil','Cooking spray','Foil, parchment, plastic wrap, paper towels']);
section('equipment','3. Equipment checklist').innerHTML=checklist('Kitchen inventory',['Turkey roasting pan','Instant-read or leave-in meat thermometer','Two 9 × 13-inch baking dishes','Baking sheet for brioche','Baking sheet that fits June oven','Roll baking pan','Large potato pot and masher','Pasta pot and colander','Large stuffing skillet','Cheese sauce pan','Cranberry saucepan','Gravy pan','Small pecan pan','Whisk','Fat separator or measuring cup','Cutting board and carving knife','Instant Pot (optional)','Serving dishes, utensils and trivets']);
const wed=['0:00 — Check turkey thawing','0:05 — Preheat oven to 275°F','0:10 — Cube and toast brioche','0:15 — Start cranberry sauce','0:40 — Remove brioche; increase oven to 375°F','0:45 — Prepare apple crisp','1:10 — Bake apple crisp','1:15 — Make candied pecans','1:30 — Chop vegetables and herbs','1:55 — Remove apple crisp','2:00 — Organize ingredients and cookware','2:15 — Refrigerate cooled dishes'];section('wed','4. Wednesday — advance preparation').innerHTML='<p>Wednesday, November 25 • Allow 2–2½ hours. Times below are elapsed from whenever you start.</p>'+checklist('Wednesday timeline',wed,{timed:true});
function recipe(target,title,meta,mod,ingredients,steps){put(target,`<h3>${esc(title)}</h3><p class="muted">${esc(meta)}</p>${mod?`<p class="note"><b>MODIFIED:</b> ${esc(mod)}</p>`:''}${ingredients.length?table(ingredients):''}${checklist('Step-by-step instructions',steps)}`)}
recipe('body-wed','A. Toast the brioche','Regular oven • 275°F • 25–35 minutes','Dry bread for better stuffing texture.',[['Brioche buns','8']],['Cut buns into 1-inch cubes.','Spread evenly on baking sheet.','Bake 25–35 minutes at 275°F.','Toss halfway through.','Remove when dry and lightly toasted.','Cool completely and store airtight.']);
recipe('body-wed','B. Orange cranberry sauce','Stovetop • 20–25 minutes','Start with less sugar.',[['Cranberries','24 oz'],['Orange','1'],['Sugar','1¼ cups'],['Water','4 tbsp'],['Cinnamon','¼ tsp'],['Salt','Pinch']],['Wash cranberries and orange.','Zest orange, peel and chop flesh.','Combine all ingredients in saucepan.','Bring to simmer over medium-high heat.','Cook 12–15 minutes, stirring occasionally.','Cover and cook on low 3–5 minutes.','Taste and add sugar if desired.','Cool and refrigerate.']);
recipe('body-wed','C. Apple crisp','Regular oven • 375°F • 45 minutes','Less sugar; 1½ tsp cinnamon total; optional vanilla and nutmeg.',[['Apples','8'],['Lemon juice / zest','2 tbsp / 2 tsp'],['Filling sugar / flour','⅓ cup / 2 tbsp'],['Filling cinnamon','¾ tsp'],['Vanilla / nutmeg (optional)','1 tsp / ⅛ tsp'],['Topping flour / sugar','1¼ cups / ½ cup'],['Topping cinnamon','¾ tsp'],['Cold butter','9 tbsp'],['Pecans','Allocated portion'],['Water / salt','1–2 tsp / pinch']],['Preheat to 375°F and grease 9 × 13 dish.','Dice butter into ½-inch cubes and chill.','Peel, core and dice apples into ½-inch pieces.','Toss apples with lemon juice, zest, filling sugar, flour, cinnamon and optional spices.','Spread filling in dish.','Mix pecans, topping flour, sugar, cinnamon and salt. Optional: half brown sugar.','Rub in cold butter and water until crumbly.','Scatter topping without pressing down.','Bake 45 minutes until golden and tender.','Cool and refrigerate within two hours.']);
recipe('body-wed','D. Candied pecans','Stovetop • 10 minutes','',[['Pecans','Carrot portion'],['Brown sugar','3 tbsp'],['Water','2 tsp'],['Salt','Pinch']],['Roughly chop pecans.','Heat water, brown sugar and salt 2–3 minutes until bubbling.','Add pecans and cook 2–4 minutes.','Spread on parchment.','Cool, break apart and store airtight.']);
put('body-wed','<h3>E. Vegetable and herb preparation</h3>'+checklist('Carrots',['Peel and trim 36 oz carrots.','Slice diagonally ½ inch thick.','Peel and grate ginger.','Chop parsley.','Refrigerate separately.'])+checklist('Stuffing',['Dice 5 oz celery.','Mince 1 onion.','Chop 2 tbsp sage and 1 tbsp thyme.','Keep separate from toasted bread.'])+checklist('Gravy',['Mince ½ shallot and 1 garlic clove.','Chop ½ tsp each thyme and sage.','Refrigerate covered.'])+checklist('Turkey and organization',['Set aside 1 shallot, 4 garlic cloves and 2 thyme sprigs.','Separate herb butter portions, stock concentrates and pecans.','Set out serving dishes.','Check June pan fit and Rhodes package instructions.','Keep turkey refrigerated in original brining bag. No extra brine.']));
const th=['7:00 AM — Check turkey; if icy finish cold-water thaw in sealed bag, changing water every 30 minutes; cook immediately afterward.','10:00 AM — Start Rhodes rolls in greased pan, covered with sprayed plastic wrap.','10:30 AM — Preheat regular oven to 425°F; soften herb butter.','10:45 AM — Prepare turkey, remove neck and giblets, pat dry, add aromatics and butter.','11:00 AM — Turkey into oven at 425°F.','11:30 AM — Reduce to 350°F. MODIFIED.','12:45 PM — Prepare stuffing liquid with cranberries and concentrates.','1:00 PM — Sauté stuffing aromatics 7–8 minutes; add herbs and liquid; cool and refrigerate.','1:15 PM — Check rolls rising.','1:30 PM — Kelly prepares potatoes and garlic; cover with cold water.','1:45 PM — Begin checking turkey temperatures.','2:00 PM — Set out remaining ingredients and cookware.','2:00–2:45 PM — Expected turkey completion; all three locations must reach 165°F. Rest and reserve drippings.','2:30 PM — Assemble stuffing; refrigerate if waiting for oven.','2:40 PM — Start Kelly’s potatoes.','2:45 PM — Once turkey is out, preheat regular oven to 450°F.','2:50 PM — Start gravy; hold hot once finished.','2:55 PM — Bake stuffing covered 20 minutes.','2:55 PM — Preheat June to 425°F; toss carrots.','3:05 PM — Roast carrots 20–25 minutes. Start pasta water.','3:10 PM — Mash potatoes; cover and keep hot.','3:15 PM — Uncover stuffing; bake 10–15 minutes more. Cook pasta and cheese sauce.','3:25 PM — Check stuffing; center 165°F. Remove and reduce oven to 350°F.','3:30 PM — Finish carrots; bake risen rolls in whichever oven is ready at 350°F.','3:35 PM — Finish mac and cheese; hold hot.','3:40 PM — Carve turkey; check hot holding.','3:45 PM — Finish sides; top carrots; plate cranberry sauce.','3:50 PM — Butter rolls and transfer to serving dishes.','4:00 PM — A VERY BAB THANKSGIVING!','After dinner — Reheat apple crisp and serve with ice cream.'];section('thu','5. Thursday — master run of show').innerHTML='<div class="card"><div class="muted" style="text-align:center">DINNER TARGET • ARIZONA TIME</div><div class="hero">4:00 PM</div></div>'+checklist('Thursday cooking checklist',th,{timed:true});
function lane(name,bars){return `<div class="chartrow"><b>${name}</b><div class="lane">${bars.map(([start,end,label,color])=>`<div class="bar" style="left:${start/3}%;width:${(end-start)/3}%;background:${color}">${label}</div>`).join('')}</div></div>`}put('body-thu','<h3>Visual appliance schedule</h3><div class="card"><div class="chartrow"><span></span><div style="display:flex;justify-content:space-between">'+['11 AM','Noon','1 PM','2 PM','3 PM','4 PM'].map(x=>`<span>${x}</span>`).join('')+'</div></div>'+lane('Regular oven',[[0,30,'425°','#985735'],[30,225,'Turkey 350°','#b17a4a'],[235,270,'Stuffing','#985735']])+lane('June oven',[[245,270,'Carrots','#5d83ad'],[270,290,'Rolls','#5d83ad']])+lane('Potatoes',[[100,130,'Prep','#64845a'],[220,250,'Cook','#64845a'],[250,300,'Hold','#78966e']])+lane('Gravy',[[230,255,'Cook','#64845a'],[255,300,'Hold','#78966e']])+lane('Mac & cheese',[[245,275,'Cook','#64845a']])+lane('Final prep',[[280,300,'Plate','#9474b0']])+'<small>Times are targets. Rolls may use either oven; allow time for temperature changes.</small></div>');
section('recipes','6. Thursday — complete cooking instructions');
recipe('body-recipes','1. Garlic herb roasted turkey','Start 10:45 AM • 425°F then 350°F • 3–3½ hours, possibly longer','No additional brine; butter under skin; lower temperature after 30 minutes.',[['Pre-brined turkey','14 lb'],['Shallot','1'],['Garlic','4 cloves'],['Thyme','2 sprigs'],['Garlic herb butter','Turkey portion'],['Pepper','To taste']],['Preheat regular oven to 425°F.','Remove turkey from bag; remove neck and giblets.','Do not rinse; pat thoroughly dry.','Leave leg clamp only if oven-safe.','Halve shallot and peel garlic.','Place shallot, garlic and thyme in cavity.','Gently loosen breast skin.','Rub half softened herb butter underneath skin and remainder outside.','Season with pepper; avoid substantial extra salt.','Place breast up in roasting pan; tuck wings.','Roast at 11 AM at 425°F.','At 11:30 reduce to 350°F.','Begin checking temperature around 1:45 PM.','Tent breast loosely if browning too fast.','Cook until breast, inner thigh and inner wing all reach 165°F.','Rest in pan 15 minutes; transfer to board and tent loosely.','Reserve drippings.','Rest another 15 minutes before carving; hold at 140°F or above if early.']);
put('body-recipes','<div class="card"><h3>Turkey temperature tracker</h3>'+['Breast','Innermost thigh','Innermost wing'].map((x,i)=>`<div class="between" style="margin:8px 0"><label for="temp${i}">${x}</label><input class="temp" id="temp${i}" type="number" placeholder="°F" value="${esc(state['temp'+i]||'')}"></div>`).join('')+'<p id="tempstatus"></p><small>Avoid touching bone with thermometer.</small></div>');
recipe('body-recipes','2. Brioche cranberry stuffing','Prep 12:45 PM • Bake 2:55 PM • 450°F, 30–35 minutes','Toast brioche, sauté longer, add liquid gradually.',[['Toasted brioche','8 buns'],['Celery / onion','5 oz / 1'],['Dried cranberries','2 oz'],['Warm water','2 cups'],['Veggie stock concentrate','1 packet'],['Chicken concentrate','Stuffing portion'],['Garlic powder','2 tsp'],['Sage / thyme','2 tbsp / 1 tbsp'],['Eggs','2'],['Butter','5 tbsp']],['Combine warm water, cranberries and concentrates.','Melt 3 tbsp butter in pan.','Add onion and celery; season lightly.','Sauté 7–8 minutes.','Add garlic powder, sage and thyme; cook 30 seconds.','Add cranberry mixture; bring to boil.','Turn off heat; cool promptly and refrigerate if preparing ahead.','Spray 9 × 13 dish.','Beat 2 eggs.','Place toasted bread in large bowl.','Gradually add cooled vegetable mixture; toss gently until moist, not soggy.','Stir in eggs.','Transfer to dish and dot with 2 tbsp butter.','Cover with sprayed foil.','Bake covered 20 minutes at 450°F.','Uncover and bake 10–15 minutes.','Check center reaches 165°F.','Rest 5–10 minutes.']);
recipe('body-recipes','3. Kelly’s famous creamy mashed potatoes','Stovetop • Start 2:40 PM','Kelly’s traditional method; warm milk and 2 extra tbsp butter.',[['Potatoes','All supplied'],['Garlic','2 cloves'],['Sour cream','6 tbsp'],['Butter','8 tbsp'],['Milk','As needed'],['Salt and pepper','To taste']],['Peel if desired; cut potatoes into 1-inch chunks.','Add potatoes and garlic to large pot.','Cover with cold salted water by 2 inches.','Bring to boil; simmer 15–20 minutes until tender.','Warm milk separately.','Drain thoroughly.','Mash with 3 tbsp butter.','Add sour cream and half the milk.','Season to taste.','Finish with remaining butter and warm milk as desired.','Cover and keep hot.','Taste before serving. Kelly can override with her usual method.']);
recipe('body-recipes','4. Classic turkey gravy','Stovetop • After turkey comes out • 20 minutes','Chicken stock, reserved turkey fat, longer roux, gradual concentrates.',[['Drippings + chicken stock','3 cups total'],['Turkey fat','1 tbsp'],['Butter','2 tbsp'],['Flour','3 tbsp'],['Shallot / garlic','½ / 1 clove'],['Thyme / sage','½ tsp each'],['Demi-glace / concentrates','Supplied, to taste']],['Separate drippings and reserve 1 tbsp fat.','Add chicken stock to skimmed drippings to make 3 cups.','Melt butter and reserved fat.','Add aromatics; cook 1 minute.','Whisk in flour for 2–3 minutes.','Gradually whisk in liquid.','Add demi-glace and concentrates gradually to taste.','Bring to boil then simmer 10–15 minutes.','Adjust seasoning and consistency; keep hot.']);
recipe('body-recipes','5. Ginger-roasted carrots','June oven • 425°F • 20–25 minutes','Start with half ginger, single layer, pecans at serving.',[['Carrots','36 oz'],['Ginger','Half supplied initially'],['Herb butter / parsley','Carrot portions'],['Candied pecans','Prepared Wednesday'],['Oil / salt / pepper','To taste']],['Preheat June to 425°F Bake.','Toss carrots with oil, half ginger, salt and pepper.','Spread in single layer; use two batches earlier if needed.','Roast 20–25 minutes until tender.','Transfer to bowl and toss with herb butter.','Taste and cover to keep warm.','Add parsley and pecans just before serving.']);
recipe('body-recipes','6. Creamy cheddar mac and cheese','Stovetop • Start 3:05 PM • 25–30 minutes','Skip broccoli, jalapeño, tomato and baking; use milk and all supplied cheddar.',[['Cavatappi / cream sauce base / cream cheese / cheddar','All supplied'],['Stock concentrate / garlic powder','Supplied, to taste'],['Milk','¾ cup (2 servings) or 1½ cups (4) initially'],['Butter','1 tbsp (2 servings) or 2 tbsp (4)'],['Dry mustard (optional)','⅛ tsp (2) or ¼ tsp (4)']],['Bring salted water to boil.','Cook pasta 9–11 minutes; drain.','Whisk cream sauce base with reduced milk amount.','Bring to gentle simmer.','Add cream cheese, garlic powder and concentrate to taste.','Whisk 2–3 minutes until smooth.','Add optional dry mustard.','Remove from heat.','Gradually stir in all cheddar and butter.','Add milk as needed.','Combine with pasta.','Season and keep hot.','Loosen with warm milk before serving.','Optional: toast panko and Everything Bagel seasoning in butter 2–3 minutes; serve separately.']);
recipe('body-recipes','7. Rhodes dinner rolls','Start rising 10 AM • Bake around 3:30 PM • typically 350°F','Brush with melted butter after baking.',[['Rhodes Bake-N-Serv rolls','Desired quantity'],['Cooking spray / butter','As needed']],['Spray pan and arrange frozen rolls with room to expand.','Cover with sprayed plastic wrap.','Thaw and rise according to package (typically 3–5 hours).','Check progress around 1 PM.','If rising too quickly refrigerate briefly; if slow move to warm draft-free spot.','Preheat available oven to package temperature.','Remove wrap once fully risen.','Bake according to package (typically 15–20 minutes).','Brush with melted butter and serve warm.']);
section('final','7. Final 15 minutes').innerHTML=checklist('3:45–4:00 PM',['Turkey carved and hot','Gravy hot and correct consistency','Kelly’s potatoes creamy and hot','Mac and cheese stirred with milk if needed','Stuffing rested','Carrots topped with pecans and parsley','Rolls brushed with butter','Cranberry sauce in serving bowl','Serving utensils in each dish','Plates, drinks and napkins ready','Bab has inspected Thanksgiving operations']);
section('dessert','8. Dessert — after dinner').innerHTML=checklist('Apple crisp à la mode',['Preheat regular oven to 425°F.','Remove apple crisp from refrigerator.','Reheat approximately 15 minutes or until 165°F throughout; tent if topping browns too quickly. Use oven-safe dish suitable for temperature changes.','Rest 5 minutes.','Scoop into bowls and top with vanilla ice cream.']);
section('backup','9. Contingency plans').innerHTML=table([['Turkey icy','Cold-water thaw in sealed bag, change water every 30 minutes; cook immediately.'],['Turkey browning','Tent breast loosely with foil.'],['Turkey early','Rest, then hold at 140°F or above.'],['Turkey late','Use June for stuffing if it fits; roast carrots afterward or use stovetop.'],['Carrots crowded','Start earlier in two batches.'],['Rolls too fast / slow','Refrigerate briefly / move to warmer draft-free spot.'],['Oven cooling slowly','Use whichever oven is ready at 350°F.'],['Gravy too thick / thin','Add stock / simmer longer.'],['Potatoes or mac too thick','Add warm milk.'],['Stovetop crowded','Instant Pot Keep Warm for already-hot gravy; verify 140°F or above.'],['Dinner delayed','Hold hot foods at 140°F or above.'],['Leftovers','Refrigerate within two hours.']],['Problem','Solution']);
section('changes','10. Summary of our improvements').innerHTML=table([['Turkey','Butter under skin; 425°F then 350°F; no extra brine'],['Stuffing','Toast brioche; longer sauté; gradual liquid'],['Gravy','Chicken stock, turkey fat, longer roux'],['Mac and cheese','Milk, less liquid, all cheddar, no vegetables or baking'],['Apple crisp','Less sugar, 1½ tsp cinnamon total'],['Cranberry sauce','Less sugar initially'],['Carrots','Less ginger; single layer; pecans at serving'],['Potatoes','Kelly’s stovetop method and extra butter'],['Rolls','Brush with melted butter']],['Dish','Change from HelloFresh']);
section('team','11. Division of labor').innerHTML='<div class="grid">'+[['Kevin','Turkey, stuffing, gravy, carrots, mac and cheese, rolls and oven management.'],['Kelly','Famous mashed potatoes and final potato quality control.'],['Ashley & Alexis','Optional table setting, drinks, serving dishes and cleanup.'],['Bab','Executive supervision, unauthorized inspections and general management.']].map(([a,b])=>`<div class="card"><b>${a}</b><p>${b}</p></div>`).join('')+'</div><p><b>A Very Bab Thanksgiving is ready to go.</b></p><button class="controls" id="reset">Reset all checkmarks</button>';
$('nav').innerHTML=[['menu','Menu'],['ingredients','Ingredients'],['equipment','Equipment'],['wed','Wednesday'],['thu','Thursday'],['recipes','Recipes'],['final','Final 15'],['dessert','Dessert'],['backup','Backup plans'],['changes','Changes'],['team','Team']].map(([id,t])=>`<a href="#${id}">${t}</a>`).join('');function update(){let all=[...document.querySelectorAll('input[data-key]')],n=all.filter(x=>x.checked).length;$('overall').innerHTML=`<div class="between"><b>Overall progress</b><small>${n} / ${all.length}</small></div><div class="progress"><i style="width:${100*n/all.length}%"></i></div>`;document.querySelectorAll('[data-group]').forEach(g=>{let a=[...g.querySelectorAll('input')],n=a.filter(x=>x.checked).length;g.querySelector('.count').textContent=n+' / '+a.length;g.querySelector('i').style.width=100*n/a.length+'%'});save()}document.addEventListener('change',e=>{if(e.target.dataset.key){state[e.target.dataset.key]=e.target.checked;update()}});$('hide').onchange=e=>document.body.classList.toggle('hide',e.target.checked);function temps(){let ready=[0,1,2].every(i=>Number($('temp'+i).value)>=165);$('tempstatus').textContent=ready?'All three locations reached 165°F. Turkey is ready to rest.':'Continue roasting until all three locations reach 165°F.';$('tempstatus').style.color=ready?'#527044':'#666'}[0,1,2].forEach(i=>$('temp'+i).oninput=e=>{state['temp'+i]=e.target.value;save();temps()});$('reset').onclick=()=>{if(confirm('Clear all checkmarks and temperatures?')){state={};save();location.reload()}};update();temps();</script></body></html>
